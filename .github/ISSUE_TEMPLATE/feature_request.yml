name: Feature request
description: Suggest an improvement or a new feature
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before proposing a feature, please check the [roadmap](https://github.com/iMxSquash/demain/blob/main/docs/ROADMAP.md) and the list of out-of-scope items.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What are you trying to do, and why is it difficult or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like it to work?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you thought about.
  - type: textarea
    id: context
    attributes:
      label: Additional context
