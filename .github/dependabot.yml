version: 2
updates:
  # The npm and docker ecosystems are added in the same change that introduces
  # package.json and the Dockerfile: Dependabot reports an error when the
  # manifest of a configured ecosystem does not exist.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      include: "scope"
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
