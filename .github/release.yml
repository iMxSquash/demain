changelog:
  exclude:
    labels:
      - chore
      - dependencies
      - skip-changelog
    authors:
      - dependabot[bot]
  categories:
    - title: Breaking changes
      labels:
        - breaking-change
    - title: Features
      labels:
        - enhancement
    - title: Bug fixes
      labels:
        - bug
    - title: Documentation
      labels:
        - documentation
    - title: Other changes
      labels:
        - "*"
